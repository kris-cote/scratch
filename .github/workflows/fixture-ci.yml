name: Replit deep-cert fixture CI
on:
  push:
    branches: ["certification/replit-deep-fixture-v1"]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
